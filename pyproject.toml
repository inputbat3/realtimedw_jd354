[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inputbat3-realtimedw_jd354"
version = "0.1.0"
description = "把候选项映射到类别上，算出实时数仓架构师·向量索引的召回与构建代价的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "inputbat3" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://inputbat3.github.io"
Repository = "https://github.com/inputbat3/realtimedw_jd354"
Issues = "https://github.com/inputbat3/realtimedw_jd354/issues"

[project.scripts]
realtimedw_jd354 = "realtimedw_jd354:main"

[tool.setuptools]
py-modules = ["realtimedw_jd354"]
